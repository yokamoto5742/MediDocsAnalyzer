[project]
name = "medidocsanalyzer"
version = "1.0.1"
requires-python = ">=3.13"

dependencies = [
    "babel>=2.17.0",
    "openpyxl>=3.1.5",
    "polars>=1.23.0",
    "pyarrow>=19.0.1",
    "tkcalendar>=1.6.1",
]

[dependency-groups]
dev = [
    "coverage>=7.10.1",
    "pyinstaller>=6.14.2",
    "pyright>=1.1.407",
    "pytest>=8.4.1",
    "pytest-cov>=6.2.1",
    "pytest-mock>=3.14.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"

[tool.pyright]
typeCheckingMode = "standard"
pythonVersion = "3.13"
include = ["app", "service", "utils", "tests"]
exclude = ["scripts"]
reportMissingTypeStubs = false
reportUnusedVariable = true
reportUnusedImport = true
